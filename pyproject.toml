[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docintel"
version = "0.1.0"
description = "Open-source, local-first document intelligence platform"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Open Doc Intelligence Contributors" }
]
keywords = ["ocr", "document-intelligence", "docling", "vlm", "langgraph", "florence-2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "greenlet>=3.0.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
documents = [
    "docling>=2.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
]
ocr-cpu = [
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
]
ocr-vlm = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "einops>=0.8.0",
    "timm>=0.9.16",
]
workflow = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
]
evaluation = [
    "jiwer>=3.0.4",
    "matplotlib>=3.8.4",
    "seaborn>=0.13.2",
    "scikit-learn>=1.4.2",
]
retrieval = [
    "qdrant-client>=1.9.0",
    "sentence-transformers>=2.7.0",
    "networkx>=3.3",
]
audio-video = [
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[project.scripts]
docintel = "docintel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
